<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects – Hanshika</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #000;
      color: white;
      padding: 20px;
      overflow-x: hidden;
    }

    /* ----------------------------------
       GALAXY ANIMATED BACKGROUND
    -----------------------------------*/
    .galaxy {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a0535, #000);
      top: 0;
      left: 0;
      z-index: -1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: sparkle 2s infinite;
      opacity: 0.7;
    }

    @keyframes sparkle {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* ----------------------------------
       NAVBAR
    -----------------------------------*/
    nav {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      padding: 12px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 40px;
      box-shadow: 0 0 20px rgba(128,0,255,0.4);
    }

    nav a {
      color: white;
      margin: 0 18px;
      font-size: 1.1em;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #d9a7ff;
      text-shadow: 0 0 10px #d9a7ff;
    }

    /* ----------------------------------
       PROJECTS SECTION
    -----------------------------------*/
    h1.title {
      text-align: center;
      font-size: 2.6em;
      margin-bottom: 30px;
      text-shadow: 0 0 15px #cd72ff;
    }

    .projects-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
    }

    .project-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      width: 300px;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(128,0,255,0.4);
      transition: 0.4s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .project-card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px #c57dff;
    }

    .project-card a {
      text-decoration: none;
      color: white;
      font-size: 1.4em;
      font-weight: bold;
      text-shadow: 0 0 10px #d9a7ff;
      display: block;
      margin-bottom: 8px;
    }

    .emoji {
      font-size: 2.4em;
      margin-top: 10px;
      display: block;
    }

  </style>
</head>

<body>

  <!-- Galaxy Background -->
  <div class="galaxy" id="galaxy"></div>

  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="about.html">👩‍💻 About</a>
    <a href="project.html">📁 Projects</a>
    <a href="resume.html">📄 Resume</a>
    <a href="contact.html">📞 Contact</a>
  </nav>

  <h1 class="title">✨ My Projects ✨</h1>

  <div class="projects-container">

    <!-- Project 1 -->
    <div class="project-card">
      <a href="digitalclock.html" target="_blank">Digital Clock</a>
      <span class="emoji">⏰</span>
    </div>

    <!-- Project 2 -->
    <div class="project-card">
      <a href="CALCULATOR.HTML" target="_blank">Calculator</a>
      <span class="emoji">🧮</span>
    </div>

    <!-- Project 3 -->
    <div class="project-card">
      <a href="age.html" target="_blank">Age Calculator</a>
      <span class="emoji">📅</span>
    </div>

  </div>

  <!-- STAR GENERATOR -->
  <script>
    const galaxy = document.getElementById("galaxy");

    for (let i = 0; i < 200; i++) {
      let star = document.createElement("div");
      star.classList.add("star");
      star.style.top = Math.random() * 100 + "%";
      star.style.left = Math.random() * 100 + "%";
      star.style.animationDuration = (Math.random() * 2 + 1) + "s";
      galaxy.appendChild(star);
    }
  </script>

</body>
</html>
