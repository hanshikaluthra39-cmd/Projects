<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hanshika's Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    /* ---------------------------
       GALAXY ANIMATED BACKGROUND
    ----------------------------*/
    body {
      overflow-x: hidden;
      background: #000;
    }

    .galaxy {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a0535, #000000 60%);
      overflow: hidden;
      z-index: -1;
    }

    /* Stars */
    .stars {
      width: 2px;
      height: 2px;
      background: white;
      position: absolute;
      animation: twinkle 2s infinite ease-in-out;
      opacity: 0.6;
      border-radius: 50%;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* ---------------------------
       HEADER
    ----------------------------*/
    header {
      text-align: center;
      padding: 60px 20px;
      color: #fff;
      text-shadow: 0 0 15px #cd5fff;
    }

    header h1 {
      font-size: 3.2em;
      font-weight: 700;
      margin-bottom: 10px;
      animation: glow 3s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #bb72ff; }
      to { text-shadow: 0 0 25px #e8b2ff; }
    }

    header p {
      font-size: 1.3em;
      opacity: 0.85;
    }

    /* ---------------------------
       NAVBAR
    ----------------------------*/
    nav {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    nav a {
      color: white;
      font-size: 1.1em;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 50px;
      transition: 0.3s;
    }

    nav a:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.1);
    }

    /* ---------------------------
       MAIN SECTION
    ----------------------------*/
    section {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      text-align: center;
      color: white;
      box-shadow: 0 0 20px rgba(128,0,255,0.4);
    }

    section h1 {
      font-size: 2.8em;
      margin-bottom: 15px;
      font-weight: 700;
    }

    section p {
      font-size: 1.2em;
      opacity: 0.85;
      margin-top: 10px;
    }

    /* ---------------------------
       FOOTER
    ----------------------------*/
    footer {
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <!-- Galaxy Background -->
  <div class="galaxy">
    <!-- Generate random stars using JS -->
  </div>

  <header>
    <h1>✨ Welcome to Hanshika’s Portfolio ✨</h1>
    <p>Dark • Elegant • Creative ✨ | Web Developer & Designer</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html" target="_blank">About</a>
    <a href="project.html" target="_blank">Projects</a>
    <a href="resume.html" target="_blank">Resume</a>
    <a href="contact.html" target="_blank">Contact</a>
  </nav>

  <section>
    <h1>🚀 Explore My Work</h1>
    <p>Design • Creativity • Modern Web Interfaces • Smooth UI</p>
  </section>

  <footer>
    © 2025 Hanshika. All rights reserved.
  </footer>

  <!-- Star Generator Script -->
  <script>
    const galaxy = document.querySelector(".galaxy");

    for (let i = 0; i < 200; i++) {
      let star = document.createElement("div");
      star.classList.add("stars");
      star.style.top = Math.random() * 100 + "%";
      star.style.left = Math.random() * 100 + "%";
      star.style.animationDuration = (Math.random() * 2 + 1) + "s";
      galaxy.appendChild(star);
    }
  </script>

</body>
</html>
