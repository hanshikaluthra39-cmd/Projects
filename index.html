  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6); /* Adjust darkness */
    z-index: -1;
}


    header {
      background-color: #6c5ce7;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2em;
    }

    nav {
      background-color: #cf83bf;
      text-align: center;
      padding: 12px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 1.1em;
    }

    nav a:hover {
      text-decoration: underline;
      
    }

    section {
      padding: 60px 20px;
      max-width: 900px;
      margin: 40px auto;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    section h1 {
      font-size: 2.5em;
      margin-bottom: 15px;
      color: #2d3436;
    }

    section p {
      font-size: 1.1em;
    }

    footer {
      background-color: #52c2e0;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 2em;
      }

      nav a {
        display: block;
        margin: 10px 0;
      }

      section h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
