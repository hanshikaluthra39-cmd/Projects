<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hanshika • Galaxy Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Poppins", sans-serif;
    }

    /* ============================
       GALAXY ANIMATED BACKGROUND
       ============================ */
    body{
      height:100vh;
      overflow-x:hidden;
      background: radial-gradient(circle at 20% 20%, #6c5ce7, transparent 60%),
                  radial-gradient(circle at 80% 80%, #a55eea, transparent 60%),
                  radial-gradient(circle at 50% 50%, #0c0c42, #000);
      animation: galaxyGlow 10s infinite alternate ease-in-out;
    }

    /* NEBULA COLOR MOVEMENT */
    @keyframes galaxyGlow {
      0%{
        background-position: 20% 20%, 80% 80%, 50% 50%;
      }
      100%{
        background-position: 25% 30%, 70% 90%, 50% 50%;
      }
    }

    /* STAR FIELD (SMALL TWINKLING DOTS) */
    body::before{
      content:"";
      position:fixed;
      width:100%;
      height:100%;
      top:0;
      left:0;
      background-image:
          radial-gradient(2px 2px at 20% 30%, white, transparent),
          radial-gradient(1.5px 1.5px at 70% 80%, rgba(255,255,255,0.8), transparent),
          radial-gradient(1.8px 1.8px at 40% 60%, rgba(255,255,255,0.9), transparent),
          radial-gradient(1px 1px at 90% 20%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 10% 80%, rgba(255,255,255,0.9), transparent);
      animation: starsTwinkle 4s infinite ease-in-out alternate;
      z-index:-1;
    }

    @keyframes starsTwinkle {
      0% { opacity:0.6; }
      100% { opacity:1; }
    }

    /* HEADER */
    header{
      text-align:center;
      padding:60px 20px;
      color:white;
      animation: fadeDown 1s ease;
    }

    header h1{
      font-size:3rem;
      text-shadow:0 0 15px rgba(255,255,255,0.9);
    }

    header p{
      margin-top:10px;
      font-size:1.3rem;
      opacity:0.9;
    }

    /* NAVIGATION */
    nav{
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      padding:12px 0;
      text-align:center;
      border-radius:10px;
      width:90%;
      margin:0 auto;
      box-shadow:0 0 15px rgba(255,255,255,0.2);
    }

    nav a{
      color:white;
      margin:0 18px;
      text-decoration:none;
      font-weight:600;
      font-size:1.15rem;
      transition:0.3s;
    }

    nav a:hover{
      color:#ffeaa7;
      text-shadow:0 0 12px #ffeaa7;
    }

    /* SECTION */
    section{
      max-width:900px;
      margin:70px auto;
      padding:50px;
      background:rgba(255,255,255,0.08);
      border-radius:15px;
      backdrop-filter:blur(10px);
      color:white;
      text-align:center;
      box-shadow:0 0 20px rgba(255,255,255,0.3);
      animation: fadeUp 1.3s ease;
    }

    section h1{
      font-size:2.8rem;
      margin-bottom:15px;
      text-shadow:0 0 15px rgba(255,255,255,0.9);
    }

    section p{
      font-size:1.2rem;
      line-height:1.6;
    }

    /* FOOTER */
    footer{
      background:rgba(0,0,0,0.4);
      color:white;
      text-align:center;
      padding:20px;
      font-size:1rem;
      margin-top:40px;
    }

    /* ANIMATIONS */
    @keyframes fadeUp{
      from{ opacity:0; transform:translateY(40px); }
      to{ opacity:1; transform:translateY(0); }
    }

    @keyframes fadeDown{
      from{ opacity:0; transform:translateY(-40px); }
      to{ opacity:1; transform:translateY(0); }
    }

    /* RESPONSIVE */
    @media(max-width:600px){
      header h1{ font-size:2.2rem; }
      nav a{ display:block; margin:10px 0; }
      section{ padding:30px; width:90%; }
      section h1{ font-size:2.2rem; }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌌 Hanshika</h1>
    <p>💻 Web Developer • 🎨 Designer • 🚀 Dreaming Big</p>
  </header>

  <nav>
    <a href="index.html">🏠 Home</a>
    <a href="about.html" target="_blank">👩‍💼 About</a>
    <a href="project.html" target="_blank">📁 Projects</a>
    <a href="resume.html" target="_blank">📄 Resume</a>
    <a href="contact.html" target="_blank">📞 Contact</a>
  </nav>

  <section>
    <h1>👋 Welcome to the Galaxy</h1>
    <p>
      Explore my universe of beautiful designs, creative ideas,  
      and innovative coding projects. 🌟  
    </p>
  </section>

  <footer>
    <p>© 2025 Hanshika. All Rights Reserved.</p>
  </footer>

</body>
</html>
